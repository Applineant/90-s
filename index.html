<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pub'Flix - Rétro Ads 90-2000</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1d1836;
            --accent-pink: #ff2a75;
            --accent-cyan: #00f0ff;
            --text-color: #ffffff;
            --text-muted: #a099c0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #15102a;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-pink);
            box-shadow: 0 4px 15px rgba(255, 42, 117, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        nav {
            display: flex;
            justify-content: center;
            background: #15102a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            max-width: 200px;
            padding: 15px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-btn.active {
            color: var(--accent-pink);
            border-bottom-color: var(--accent-pink);
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-pink);
            background: var(--card-bg);
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 42, 117, 0.2);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-video {
            width: 100%;
            background: #000;
        }

        .card-video video {
            width: 100%;
            display: block;
            max-height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-cyan);
            margin: 0 0 5px 0;
        }

        .card-slogan {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .tag {
            display: inline-block;
            background: var(--accent-pink);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .quiz-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .timer-bar {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-pink);
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .opt-btn {
            background: #2a234d;
            border: 1px solid var(--accent-pink);
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .opt-btn:hover {
            background: var(--accent-pink);
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>📼 PUB'FLIX</h1>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('catalogue')">📺 Catalogue</button>
        <button class="nav-btn" onclick="switchTab('quiz')">🎮 Mode Quiz</button>
    </nav>

    <main>
        <section id="tab-catalogue">
            <input type="text" class="search-bar" id="searchInput" placeholder="Rechercher une pub, un slogan..." onkeyup="filterAds()">
            <div class="grid" id="adsGrid"></div>
        </section>

        <section id="tab-quiz" class="hidden">
            <div class="quiz-box">
                <div class="score-board">Score : <span id="score">0</span> pt(s)</div>
                <div class="timer-bar">⏱️ <span id="timer">10</span>s</div>
                
                <h2 id="quizQuestion">Chargement...</h2>
                
                <div class="options-grid" id="optionsGrid"></div>
            </div>
        </section>
    </main>

    <script>
        const adsData = [
            { 
                brand: "Sega Megadrive", 
                slogan: "Sega, c'est plus fort que toi !", 
                year: "1992", 
                videoUrl: "https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c4/Sega_Genesis_Logo.webm/Sega_Genesis_Logo.webm.480p.vp9.webm", 
                category: "Jeux Video" 
            },
            { 
                brand: "Nestlé Maurice", 
                slogan: "Tu pousses le bouchon un peu trop loin !", 
                year: "1994", 
                videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4", 
                category: "Alimentation" 
            },
            { 
                brand: "Orangina", 
                slogan: "Secouez, secouez-moi !", 
                year: "1999", 
                videoUrl: "https://upload.wikimedia.org/wikipedia/commons/transcoded/f/f1/Sintel_movie_480p.webm/Sintel_movie_480p.webm.360p.vp9.webm", 
                category: "Boissons" 
            },
            { 
                brand: "Renault Twingo", 
                slogan: "À vous d'inventer la vie qui va avec", 
                year: "1993", 
                videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/friday.mp4", 
                category: "Automobile" 
            }
        ];

        function switchTab(tabName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(tabName === 'catalogue') {
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                document.getElementById('tab-catalogue').classList.remove('hidden');
                document.getElementById('tab-quiz').classList.add('hidden');
                stopQuiz();
            } else {
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                document.getElementById('tab-catalogue').classList.add('hidden');
                document.getElementById('tab-quiz').classList.remove('hidden');
                startQuiz();
            }
        }

        function renderCatalogue(data) {
            const grid = document.getElementById('adsGrid');
            grid.innerHTML = '';
            data.forEach(ad => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-video">
                            <video controls preload="metadata">
                                <source src="${ad.videoUrl}">
                                Votre navigateur ne supporte pas la lecture vidéo.
                            </video>
                        </div>
                        <div class="card-content">
                            <div class="card-title">${ad.brand} (${ad.year})</div>
                            <div class="card-slogan">"${ad.slogan}"</div>
                            <span class="tag">${ad.category}</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterAds() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = adsData.filter(ad => 
                ad.brand.toLowerCase().includes(query) || 
                ad.slogan.toLowerCase().includes(query)
            );
            renderCatalogue(filtered);
        }

        let score = 0;
        let timer = 10;
        let interval;

        const questions = [
            { q: "Qui pousse le bouchon un peu trop loin ?", opts: ["Maurice", "Le Lapin", "George Clooney", "Flat Eric"], ans: 0 },
            { q: "Quel est le slogan emblématique de Sega ?", opts: ["C'est tout ce que j'aime", "C'est plus fort que toi !", "Think Different", "Whassup?!"], ans: 1 },
            { q: "Quel était le slogan de la première Renault Twingo ?", opts: ["Créateur d'automobiles", "À vous d'inventer la vie qui va avec", "Das Auto", "Sans maîtrise la puissance n'est rien"], ans: 1 },
            { q: "Que faut-il faire avec la bouteille d'Orangina avant de consommer ?", opts: ["La chauffer", "La secouer", "La geler", "La percer"], ans: 1 }
        ];
        let currentQ = 0;

        function startQuiz() {
            score = 0;
            currentQ = 0;
            document.getElementById('score').innerText = score;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(interval);
            timer = 10;
            document.getElementById('timer').innerText = timer;
            
            const q = questions[currentQ];
            document.getElementById('quizQuestion').innerText = q.q;
            
            const optsDiv = document.getElementById('optionsGrid');
            optsDiv.innerHTML = '';
            q.opts.forEach((opt, idx) => {
                optsDiv.innerHTML += `<button class="opt-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
            });

            interval = setInterval(() => {
                timer--;
                document.getElementById('timer').innerText = timer;
                if(timer <= 0) {
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(idx) {
            if(idx === questions[currentQ].ans) {
                score++;
                document.getElementById('score').innerText = score;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
            } else {
                clearInterval(interval);
                document.getElementById('quizQuestion').innerText = `Partie terminée ! Score final : ${score} pt(s)`;
                document.getElementById('optionsGrid').innerHTML = `<button class="opt-btn" onclick="startQuiz()">Recommencer</button>`;
            }
        }

        function stopQuiz() {
            clearInterval(interval);
        }

        renderCatalogue(adsData);
    </script>
</body>
</html>
