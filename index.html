<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pub'Flix - Rétro Ads 90-2000</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1d1836;
            --accent-pink: #ff2a75;
            --accent-cyan: #00f0ff;
            --text-color: #ffffff;
            --text-muted: #a099c0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #15102a;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-pink);
            box-shadow: 0 4px 15px rgba(255, 42, 117, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        nav {
            display: flex;
            justify-content: center;
            background: #15102a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            max-width: 200px;
            padding: 15px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-btn.active {
            color: var(--accent-pink);
            border-bottom-color: var(--accent-pink);
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-pink);
            background: var(--card-bg);
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 42, 117, 0.2);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-cyan);
            margin-bottom: 5px;
        }

        .card-slogan {
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .tag {
            display: inline-block;
            background: var(--accent-pink);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-play {
            display: block;
            text-align: center;
            padding: 12px;
            background: var(--accent-cyan);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .btn-play:hover {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.4);
        }

        .quiz-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .timer-bar {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-pink);
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .opt-btn {
            background: #2a234d;
            border: 1px solid var(--accent-pink);
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .opt-btn:hover {
            background: var(--accent-pink);
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>📼 PUB'FLIX</h1>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('catalogue')">📺 Catalogue</button>
        <button class="nav-btn" onclick="switchTab('quiz')">🎮 Mode Quiz</button>
    </nav>

    <main>
        <section id="tab-catalogue">
            <input type="text" class="search-bar" id="searchInput" placeholder="Rechercher une pub, un slogan..." onkeyup="filterAds()">
            <div class="grid" id="adsGrid"></div>
        </section>

        <section id="tab-quiz" class="hidden">
            <div class="quiz-box">
                <div class="score-board">Score : <span id="score">0</span> pt(s)</div>
                <div class="timer-bar">⏱️ <span id="timer">10</span>s</div>
                
                <h2 id="quizQuestion">Chargement...</h2>
                
                <div class="options-grid" id="optionsGrid"></div>
            </div>
        </section>
    </main>

    <script>
        const adsData = [
            { brand: "Sega", slogan: "Sega, c'est plus fort que toi !", year: "Années 90", videoId: "G_k4-42_Sg0", category: "Jeux Video" },
            { brand: "Nestlé (ChocoSui’s)", slogan: "Tu pousses le bouchon un peu trop loin, Maurice !", year: "1994", videoId: "Qp49X_N2c50", category: "Alimentation" },
            { brand: "Orangina Rouge", slogan: "Mais pourquoi est-il aussi méchant ?", year: "1999", videoId: "5j93N_v_0qY", category: "Boissons" },
            { brand: "118 218", slogan: "Toutouyoutou", year: "2004", videoId: "S_rZg1G3yI8", category: "Services" }
        ];

        function switchTab(tabName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(tabName === 'catalogue') {
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                document.getElementById('tab-catalogue').classList.remove('hidden');
                document.getElementById('tab-quiz').classList.add('hidden');
                stopQuiz();
            } else {
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                document.getElementById('tab-catalogue').classList.add('hidden');
                document.getElementById('tab-quiz').classList.remove('hidden');
                startQuiz();
            }
        }

        function renderCatalogue(data) {
            const grid = document.getElementById('adsGrid');
            grid.innerHTML = '';
            data.forEach(ad => {
                const url = "https://www.youtube.com/watch?v=" + ad.videoId;
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="card-title">${ad.brand} (${ad.year})</div>
                            <div class="card-slogan">"${ad.slogan}"</div>
                            <span class="tag">${ad.category}</span>
                        </div>
                        <a href="${url}" target="_blank" class="btn-play">▶ Regarder la pub</a>
                    </div>
                `;
            });
        }

        function filterAds() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = adsData.filter(ad => 
                ad.brand.toLowerCase().includes(query) || 
                ad.slogan.toLowerCase().includes(query)
            );
            renderCatalogue(filtered);
        }

        let score = 0;
        let timer = 10;
        let interval;

        const questions = [
            { q: "Qui pousse le bouchon un peu trop loin ?", opts: ["Maurice", "Le Lapin", "George Clooney", "Flat Eric"], ans: 0 },
            { q: "Quel est le slogan emblématique de Sega ?", opts: ["C'est tout ce que j'aime", "C'est plus fort que toi !", "Think Different", "Whassup?!"], ans: 1 },
            { q: "Pourquoi le citron d'Orangina Rouge est-il si méchant ?", opts: ["Parce qu'il est aigre", "PARCE QUE !", "Parce qu'il n'a pas de jus", "On ne sait pas"], ans: 1 }
        ];
        let currentQ = 0;

        function startQuiz() {
            score = 0;
            currentQ = 0;
            document.getElementById('score').innerText = score;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(interval);
            timer = 10;
            document.getElementById('timer').innerText = timer;
            
            const q = questions[currentQ];
            document.getElementById('quizQuestion').innerText = q.q;
            
            const optsDiv = document.getElementById('optionsGrid');
            optsDiv.innerHTML = '';
            q.opts.forEach((opt, idx) => {
                optsDiv.innerHTML += `<button class="opt-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
            });

            interval = setInterval(() => {
                timer--;
                document.getElementById('timer').innerText = timer;
                if(timer <= 0) {
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(idx) {
            if(idx === questions[currentQ].ans) {
                score++;
                document.getElementById('score').innerText = score;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
            } else {
                clearInterval(interval);
                document.getElementById('quizQuestion').innerText = `Partie terminée ! Score final : ${score} pt(s)`;
                document.getElementById('optionsGrid').innerHTML = `<button class="opt-btn" onclick="startQuiz()">Recommencer</button>`;
            }
        }

        function stopQuiz() {
            clearInterval(interval);
        }

        renderCatalogue(adsData);
    </script>
</body>
</html>
